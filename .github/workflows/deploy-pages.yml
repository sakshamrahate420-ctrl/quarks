name: Deploy QUARKS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Build QuantumLab WebAssembly engine
        run: |
          emcmake cmake -S . -B build/wasm-pages -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DQUANTUMLAB_BUILD_WASM=ON \
            -DQUANTUMLAB_BUILD_TESTS=OFF
          cmake --build build/wasm-pages --parallel
          mkdir -p build/wasm
          cp build/wasm-pages/quantumlab_wasm.mjs build/wasm/
          cp build/wasm-pages/quantumlab_wasm.wasm build/wasm/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend packages
        run: npm ci --prefix frontend

      - name: Build frontend for GitHub Pages
        run: npm run build --prefix frontend
        env:
          VITE_BASE_PATH: /quarks/

      - name: Add GitHub Pages SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
